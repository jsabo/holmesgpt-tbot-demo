# The AI agent's guardrails, enforced at Teleport's proxy no matter what the
# LLM decides to run:
#   kubernetes_labels    → which clusters exist for the bot (env=prod never
#                          matches: production is invisible, not just denied)
#   kubernetes_resources → read-only verbs
#   kubernetes_groups    → impersonated on the kube API; bind teleport-readonly
#                          to the built-in "view" ClusterRole once per cluster
#                          (README step 1). If your clusters already bind a
#                          read-only group for Teleport, put that group here
#                          instead and skip the binding.
kind: role
version: v8
metadata:
  name: sre-agent
  description: "AI SRE agent: read-only Kubernetes on dev/demo clusters; prod invisible"
spec:
  allow:
    kubernetes_labels:
      env: ["dev", "demo"]
    kubernetes_groups: ["teleport-readonly"]
    # Teleport passes every verb through; Kubernetes decides. The impersonated
    # teleport-readonly group is bound to the built-in "view" ClusterRole, so a
    # write is refused by the API server with a 403 -- and a 403 is recorded as
    # a kube.request audit event.
    #
    # Restricting the verbs here instead would refuse the write at the proxy,
    # before it reaches the cluster, and no audit event would exist. Being able
    # to show the refusal is worth more than refusing it one hop earlier.
    kubernetes_resources:
      - kind: "*"
        api_group: "*"
        namespace: "*"
        name: "*"
        verbs: ["*"]
